         *{
            margin:0;
            padding: 0;
         }
         .header{
            width: 100%;
            height: 20vh;
            background-color: aquamarine;
         }
         .sidebar1{
            height: 60vh;
            width: 20%;
            background-color: gray;
         }
         .sidebar2{
            height: 60vh;
            width: 20%;
            background-color: orange;
         }
         .footer{
            width: 100%;
            height: 20vh;
            background-color: green;
            clear: both;
         }
         .body{
            width: 60%;
            height: 60vh;
            background-color: blue;
            clear: none;
         }
        .sidebar1,.body,.sidebar2{
            float: left;
        }

<div class="main">
    <div class="header">Header</div>
        <div class="sidebar1">sidebar</div>
        <div class="body">Body</div>

</div>
