<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            background-color: white;
            display: flex;
        }
        div:nth-child(even){
            background-color: green;
            color:#fff;
            font-size: 2.5em;
            text-align: center;
            height: 30vh;
            width:25%;
        }
        .main>div:nth-child(odd){
            background-color: black;
            color: white;
            font-size:2.5em;
            text-align: center;
            height: 30vh;
            width:25%;
        }
    </style>
</head>
<body>
<div class="main">
    <div class="content1">Div1</div>
    <div class="content2">Div2</div>
    <div class="content3">Div3</div>
    <div class="content4">Div4</div>
    <div class="content5">Div5</div>
    <div class="content6">Div6</div>
    <div class="content7">Div7</div>
    <div class="content8">Div8</div>
    <div class="content9">Div9</div>
    <div class="content10">Div10</div>
</div>
</body>
</html>
