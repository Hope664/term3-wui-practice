<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> HP Layout</title>
    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    background: #f2f2f2;
    font-family: Arial, Helvetica, sans-serif;
    padding: 20px;
}

.navbar{
    width: 100%;
    height: 80px;
    background: linear-gradient(to right, #2d7dd2, #4ea3ff);
    padding: 15px 30px;
    border-radius: 4px;
}

.logo{
    width: 10%;
    height: 50px;
    background: white;
    float: left;
    border-radius: 50px;
    text-align: center;
    line-height: 50px;
    font-weight: bold;
}

.search{
    width: 50%;
    height: 50px;
    background: white;
    float: left;
    margin-left: 80px;
    border-radius: 6px;
    line-height: 50px;
    padding-left: 20px;
    color: gray;
}

/* .icons{
    width: 15%;
    height: 50px;
    float: right;
    background: rgba(255,255,255,0.2);
    border-radius: 6px;
    text-align: center;
    line-height: 50px;
    color: white;
} */


.main{
    width: 100%;
    margin-top: 20px;
    overflow: hidden;
}


.sidebar{
    width: 10%;
    height: 850px;
    background: linear-gradient(to bottom, #eceff3, #dfe4ea);
    float: left;
    border-radius: 4px;
}

.content{
    width: 88%;
    float: right;
}


.hero{
    width: 100%;
    height: 280px;
    background: linear-gradient(to right, #2d7dd2, #b8e1ff);
    border-radius: 6px;
}


.cards{
    width: 100%;
    margin-top: 25px;
    overflow: hidden;
}

.card{
    width: 31%;
    height: 170px;
    background: #e7ebf0;
    float: left;
    border-radius: 6px;
}

.card:nth-child(2){
    margin-left: 3.5%;
    margin-right: 3.5%;
}


.bottom-section{
    width: 100%;
    margin-top: 30px;
    overflow: hidden;
}

.large-box{
    width: 55%;
    height: 280px;
    background: linear-gradient(to right, #2d7dd2, #b8e1ff);
    float: left;
    border-radius: 6px;
}


.small-boxes{
    width: 42%;
    float: right;
}

.small-box{
    width: 47%;
    height: 135px;
    background: #e7ebf0;
    float: left;
    margin-bottom: 10px;
    border-radius: 6px;
}

.small-box:nth-child(1),
.small-box:nth-child(3){
    margin-right: 6%;
}
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo"></div>
        <div class="search"></div>
        <div class="icons"></div>
    </div>
    <div class="main">
        <div class="sidebar"></div>
        <div class="content">
            <div class="hero"></div>
            <div class="cards">
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
            </div>
            <div class="bottom-section">
                <div class="large-box"></div>
                <div class="small-boxes">
                    <div class="small-box"></div>
                    <div class="small-box"></div>
                    <div class="small-box"></div>
                    <div class="small-box"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
